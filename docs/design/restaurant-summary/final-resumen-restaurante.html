<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiNNo · Versión final · Resumen del restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  REFERENCIA VISUAL, NO CÓDIGO DE PRODUCCIÓN. Datos de ejemplo (Casa 72, 1–17 nov 2026).
  Hex temporales; en el repo van los tokens del manual. ?theme=dark · Haz clic en un día del calendario.
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:500}
button{font-family:inherit;cursor:pointer}
.tab{font-variant-numeric:tabular-nums}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(244,105,53,.5)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var qs = new URLSearchParams(location.search);
var S = { day: 8, theme: qs.get('theme') === 'dark' ? 'dark' : 'light', opt: (qs.get('opt') || 'a'), hover: null, noBar: qs.get('bare') === '1' };
var fmt = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
var T = {
  light: { bg:'#FAF7F1', card:'#FFFFFF', card2:'#F2EFE8', text:'#10252B', text2:'#5E6B70', border:'#E2E6E3',
    accent:'#F46935', accentText:'#B83F14', accentSoft:'#FDE6DB', ok:'#2B8F62', okSoft:'#DCEFE5', limited:'#B7801F', limitedSoft:'#F6EBD3',
    strong:'#1D5661', muted:'#CBD5D3', faint:'#ECEFEC', navBg:'#103B46', navText:'#FAF7F1',
    shadow:'0 1px 2px rgba(16,37,43,.05),0 10px 28px -12px rgba(16,37,43,.18)',
    ramp:['#F2EFE8','#DCE4E2','#A9C0BF','#F2C3A4','#F79A6C','#F46935'] },
  dark: { bg:'#0B2D36', card:'#103B46', card2:'#164853', text:'#FAF7F1', text2:'#A9BDC0', border:'#24525D',
    accent:'#FF8456', accentText:'#FF8456', accentSoft:'#3A3A35', ok:'#3FBF86', okSoft:'#18493F', limited:'#E0A93B', limitedSoft:'#3B3F2F',
    strong:'#7FC1CB', muted:'#2C5862', faint:'#173F49', navBg:'#1D5661', navText:'#FAF7F1', shadow:'none',
    ramp:['#0F3540','#1A5662','#2F7174','#8E7A55','#D57744','#FF8456'] }
};

/* ---------- Datos de ejemplo (coinciden con la captura actual de Casa 72) ---------- */
var D = {
  name:'Casa 72', period:'1 al 17 de noviembre', today:17, daysInMonth:30, fee:2000,
  checkins:6, guests:13, created:18, cancelled:10, expired:2, active:0,
  prev:{ checkins:4, guests:9, created:15, label:'octubre (mismo tramo)' },
  ticket:38000, /* lo configuraría el restaurante (función nueva) */
  avgParty:2.44, avgArrivalMin:9, newGuests:9, returningGuests:4,
  peak:[{h:'7:00 p. m.',n:6},{h:'10:00 p. m.',n:3},{h:'3:00 p. m.',n:2}],
  week:[['Lunes',6],['Martes',3],['Miércoles',2],['Jueves',0],['Viernes',0],['Sábado',0],['Domingo',7]],
  days:[0,1,0,2,0,1,3,4,0,3,2,0,0,0,1,1,0], /* reservas creadas por día 1..17 */
  ciDays:{8:2,10:2,11:1,16:1},
  rows:[['16 nov · 9:09 p. m.','Mesa 03',3],['11 nov · 7:46 p. m.','Mesa 01',2],['10 nov · 10:54 p. m.','Mesa 01',2],['10 nov · 10:42 p. m.','Mesa 01',2],['8 nov · 3:47 p. m.','Mesa 04',2],['8 nov · 11:56 a. m.','Mesa 04',2]],
  tables:[['Mesa 01',3],['Mesa 04',2],['Mesa 03',1],['Mesa 02',0]],
  months:[{s:'Jun',g:0},{s:'Jul',g:2},{s:'Ago',g:5},{s:'Sep',g:7},{s:'Oct',g:11},{s:'Nov',g:13,live:true}]
};
/* matriz día×hora 7..22 (lun..dom) */
var HEAT = (function(){ var m=[]; for(var d=0;d<7;d++){m.push([]);for(var h=7;h<=22;h++){m[d].push(0);}}
  var put=function(d,h,n){m[d][h-7]+=n;}; put(0,19,3);put(0,22,2);put(0,15,1);put(1,19,2);put(1,13,1);put(2,22,1);put(2,15,1);put(6,19,1);put(6,12,2);put(6,20,2);put(6,13,1);put(6,22,1); return m;})();

var t = function(){ return T[S.theme]; };
var card = function(inner, extra){ var c=t(); return '<section style="background:'+c.card+';border:1px solid '+c.border+';border-radius:20px;box-shadow:'+c.shadow+';padding:24px;'+(extra||'')+'">'+inner+'</section>'; };
var h2 = function(title, sub){ var c=t(); return '<div><h2 style="margin:0;font-size:17px;font-weight:800;color:'+c.text+'">'+title+'</h2>'+(sub?'<p style="margin:4px 0 0;font-size:13px;color:'+c.text2+'">'+sub+'</p>':'')+'</div>'; };
var chip = function(txt, kind){ var c=t(); var map={ok:[c.okSoft,c.ok,'●'],lim:[c.limitedSoft,c.limited,'■'],acc:[c.accentSoft,c.accentText,'▲']}; var k=map[kind||'ok'];
  return '<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:'+k[0]+';color:'+k[1]+';font-size:12px;font-weight:700"><span style="font-size:9px">'+k[2]+'</span>'+txt+'</span>'; };
var pct = function(a,b){ return b? Math.round((a-b)/b*100):0; };
var delta = function(a,b){ var c=t(), p=pct(a,b), up=p>=0; return '<span class="tab" style="font-size:13px;font-weight:700;color:'+(up?c.ok:c.accentText)+'">'+(up?'▲ +':'▼ ')+p+' %</span> <span style="font-size:13px;color:'+c.text2+'">vs. '+D.prev.label+'</span>'; };

/* ---------- Piezas comunes ---------- */
function topbar(){ var c=t(); return '<header style="display:flex;align-items:center;justify-content:space-between;background:'+c.card+';border:1px solid '+c.border+';border-radius:999px;padding:12px 18px 12px 24px;box-shadow:'+c.shadow+'">'+
  '<strong style="font-size:17px;color:'+c.text+'">'+D.name+'</strong>'+
  '<div style="display:flex;align-items:center;gap:14px;font-size:13px;color:'+c.text2+'">Estado del restaurante <span style="width:40px;height:22px;border-radius:99px;background:'+c.ok+';position:relative;display:inline-block"><span style="position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff"></span></span><strong style="color:'+c.text+'"><span style="color:'+c.ok+'">●</span> Abierto</strong><span style="width:34px;height:34px;border-radius:50%;background:'+c.navBg+';color:'+c.navText+';display:grid;place-items:center;font-weight:800">C</span></div></header>'; }
function dock(){ var c=t(); var it=['Mesas','Resumen','Restaurante','Bitácora'];
  return '<nav style="margin:24px auto 0;display:flex;gap:6px;width:max-content;background:'+c.card+';border:1px solid '+c.border+';border-radius:22px;padding:8px;box-shadow:'+c.shadow+'">'+it.map(function(x){var a=x==='Resumen';return '<span style="padding:10px 18px;border-radius:14px;font-size:13px;font-weight:700;background:'+(a?c.navBg:'transparent')+';color:'+(a?c.navText:c.text2)+'">'+x+'</span>';}).join('')+'</nav>'; }
function periodBar(){ var c=t(); var seg=['Este mes','Mes anterior','Personalizado'];
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div style="display:flex;background:'+c.card2+';border-radius:14px;padding:4px">'+seg.map(function(s,i){return '<span style="padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;'+(i===0?'background:'+c.card+';color:'+c.text+';box-shadow:'+c.shadow:'color:'+c.text2)+'">'+s+'</span>';}).join('')+'</div><span style="font-size:13px;color:'+c.text2+'">Del 1 al 17 de noviembre de 2026</span></div>'; }
function title(t1,sub){ var c=t(); return '<div><h1 style="margin:0;font-size:30px;font-weight:800;color:'+c.text+';letter-spacing:-.02em">'+t1+'</h1><p style="margin:6px 0 0;font-size:14px;color:'+c.text2+'">'+sub+'</p></div>'; }

function funnelBar(){ var c=t(); var tot=D.created; var parts=[[D.checkins,'Llegaron',c.strong,'●'],[D.expired,'No llegaron',c.limited,'■'],[D.cancelled,'Canceladas',c.muted,'—']];
  return '<div style="display:flex;gap:4px;height:14px;border-radius:8px;overflow:hidden">'+parts.map(function(p){return '<span style="flex:'+p[0]+';background:'+p[2]+'"></span>';}).join('')+'</div>'+
  '<div style="display:flex;gap:18px;margin-top:10px;flex-wrap:wrap">'+parts.map(function(p){return '<span style="font-size:13px;color:'+c.text2+'"><span style="color:'+p[2]+'">'+p[3]+'</span> <strong class="tab" style="color:'+c.text+'">'+p[0]+'</strong> '+p[1]+'</span>';}).join('')+'</div>'; }

function weekBars(compact){ var c=t(); var max=7; var best='Domingo';
  return D.week.map(function(w){ var b=w[0]===best; return '<div style="display:grid;grid-template-columns:'+(compact?'34px':'86px')+' 1fr 22px;align-items:center;gap:10px;margin:7px 0"><span style="font-size:13px;color:'+(b?c.text:c.text2)+';font-weight:'+(b?800:500)+'">'+(compact?w[0].slice(0,3):w[0])+'</span><span style="height:'+(compact?8:10)+'px;border-radius:6px;background:'+c.faint+';overflow:hidden"><span style="display:block;height:100%;width:'+(w[1]/max*100)+'%;background:'+(b?c.accent:c.strong)+';border-radius:6px"></span></span><span class="tab" style="font-size:13px;text-align:right;color:'+c.text+';font-weight:700">'+w[1]+'</span></div>';}).join(''); }

function heat(small){ var c=t(); var max=3; var cell=small?16:22; var lab=['L','M','X','J','V','S','D'];
  var hrs='<div style="display:flex;gap:3px;margin-left:'+(small?18:22)+'px;margin-bottom:4px">'+[7,10,13,16,19,22].map(function(h,i){return '<span style="width:'+(i<5?(cell+3)*3:cell)+'px;font-size:10px;color:'+c.text2+'">'+(h>12?h-12:h)+(h<12?' a.':' p.')+'</span>';}).join('')+'</div>';
  return hrs+HEAT.map(function(row,d){return '<div style="display:flex;gap:3px;margin-bottom:3px;align-items:center"><span style="width:'+(small?15:19)+'px;font-size:11px;color:'+c.text2+'">'+lab[d]+'</span>'+row.map(function(v){var i=v===0?0:Math.min(5,1+Math.round(v/max*4));return '<span style="width:'+cell+'px;height:'+cell+'px;border-radius:5px;background:'+c.ramp[i]+'"></span>';}).join('')+'</div>';}).join('')+
  '<div style="display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:'+c.text2+'">Menos '+c.ramp.map(function(r){return '<span style="width:12px;height:12px;border-radius:3px;background:'+r+'"></span>';}).join('')+' Más</div>'; }

function dayBars(h){ var c=t(); var max=4; var best=8; /* 8 nov = día 8 → índice 7 */
  var bars=''; for(var d=1;d<=D.daysInMonth;d++){ var v=d<=D.today?D.days[d-1]:null; var ci=D.ciDays[d]||0; var future=v===null;
    var hh=future?100:(v/max*100); var col=future?'transparent':(d===best?c.accent:(v>=1.1?c.strong:c.muted));
    bars+='<div title="'+d+' nov" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%"><span style="width:100%;max-width:18px;height:'+Math.max(future?0:3,hh)+'%;border-radius:6px 6px 3px 3px;background:'+col+';'+(future?'border:1.5px dashed '+c.border+';height:28%':'')+'"></span>'+(ci?'<span style="width:6px;height:6px;border-radius:50%;background:'+c.ok+'"></span>':'<span style="width:6px;height:6px"></span>')+'</div>'; }
  return '<div style="display:flex;gap:4px;height:'+(h||140)+'px;align-items:flex-end">'+bars+'</div><div style="display:flex;justify-content:space-between;font-size:11px;color:'+c.text2+';margin-top:6px"><span>1 nov</span><span>15</span><span>30 nov</span></div>'+
  '<div style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:'+c.text2+'"><span><span style="color:'+c.accent+'">■</span> Mejor día</span><span><span style="color:'+c.ok+'">●</span> Hubo check-in</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border:1.5px dashed '+c.border+';border-radius:3px"></span> Días que faltan</span></div>'; }

function table(collapsed){ var c=t();
  var head='<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;padding:12px 16px;font-size:12px;color:'+c.text2+';border-bottom:1px solid '+c.border+'"><span>Fecha y hora</span><span>Mesa</span><span>Personas</span><span style="text-align:right">Tarifa</span></div>';
  var rows=(collapsed?D.rows.slice(0,3):D.rows).map(function(r){return '<div class="tab" style="display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;padding:12px 16px;font-size:14px;color:'+c.text+';border-bottom:1px solid '+c.border+'"><span>'+r[0]+'</span><span>'+r[1]+'</span><span>'+r[2]+' personas</span><span style="text-align:right">$'+fmt(D.fee)+'</span></div>';}).join('');
  return '<div style="border:1px solid '+c.border+';border-radius:16px;overflow:hidden">'+head+rows+'</div>'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:'+c.text2+'"><span><strong style="color:'+c.text+'">Total del periodo:</strong> 6 check-ins · $12.000</span>'+(collapsed?'<span style="color:'+c.accentText+';font-weight:700">Ver los 6 check-ins →</span>':'')+'</div>'; }

/* ================= VERSIÓN FINAL ================= */
var NOSHOW={4:1,7:1};
var CI_ROWS={8:[['11:56 a. m.','Mesa 04',2],['3:47 p. m.','Mesa 04',2]],10:[['10:42 p. m.','Mesa 01',2],['10:54 p. m.','Mesa 01',2]],11:[['7:46 p. m.','Mesa 01',2]],16:[['9:09 p. m.','Mesa 03',3]]};
var DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function dayInfo(d){ var cr=d<=D.today?D.days[d-1]:null; var ci=(CI_ROWS[d]||[]); var ns=NOSHOW[d]||0; var g=ci.reduce(function(a,r){return a+r[2];},0);
  return {created:cr, ci:ci.length, rows:ci, ns:ns, cancel:cr===null?0:Math.max(0,cr-ci.length-ns), guests:g, dow:DOW[(d-1)%7], future:d>D.today}; }
function optF(){ var c=t();
  var hero = card(
    '<div style="display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:center">'+
    '<div><span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+c.text2+'">Comensales con reserva DiNNo</span>'+
      '<div style="display:flex;align-items:baseline;gap:14px;margin-top:6px"><span class="tab" style="font-size:84px;line-height:1;font-weight:800;color:'+c.text+';letter-spacing:-.04em">13</span><span style="font-size:22px;font-weight:800;color:'+c.text+'">comensales</span></div>'+
      '<p style="margin:10px 0 0;font-size:15px;color:'+c.text2+'"><strong style="color:'+c.text+'">6 check-ins</strong> de 18 reservas · '+delta(D.guests,D.prev.guests)+'</p>'+
      '<div style="display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:28px;margin-top:20px;padding-top:16px;border-top:1px solid '+c.border+'">'+
        [['18','reservas creadas'],['33 %','tasa de llegada'],['2,4','personas por reserva']].map(function(k){return '<div><div class="tab" style="font-size:22px;font-weight:800;color:'+c.text+'">'+k[0]+'</div><div style="font-size:12px;color:'+c.text2+'">'+k[1]+'</div></div>';}).join('')+'</div></div>'+
    '<div style="background:'+c.card2+';border-radius:18px;padding:22px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+c.text2+'">Total a pagar a DiNNo</span>'+chip('En curso','lim')+'</div>'+
      '<div class="tab" style="font-size:40px;font-weight:800;color:'+c.text+';margin-top:6px;letter-spacing:-.03em">$12.000</div>'+
      '<div style="font-size:13px;color:'+c.text2+'">6 check-ins × tarifa de $2.000</div>'+
      '<div style="height:1px;background:'+c.border+';margin:16px 0"></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:14px;color:'+c.text+'"><span>Costo por comensal</span><strong class="tab">$923</strong></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:14px;color:'+c.text+';margin-top:8px"><span>Cierre del periodo</span><strong>30 nov</strong></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;color:'+c.text+';margin-top:8px"><span>Octubre · $8.000</span>'+chip('Pagado','ok')+'</div>'+
      '<p style="margin:14px 0 0;font-size:12px;color:'+c.text2+'">Solo pagas los check-ins. Las reservas canceladas o vencidas no tienen costo.</p>'+
    '</div></div>', 'padding:32px');

  var trend = card(h2('Comensales por mes','Últimos 6 meses')+
    '<div style="display:flex;gap:14px;height:150px;align-items:flex-end;margin-top:18px">'+D.months.map(function(m){var hh=m.g/13*100;return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><span class="tab" style="font-size:12px;font-weight:700;color:'+c.text+'">'+m.g+'</span><span style="width:100%;height:'+Math.max(3,hh)+'%;border-radius:8px 8px 4px 4px;background:'+(m.live?c.accent:c.strong)+';'+(m.live?'background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 5px,transparent 5px 10px)':'')+'"></span><span style="font-size:12px;color:'+(m.live?c.text:c.text2)+';font-weight:'+(m.live?800:500)+'">'+m.s+'</span></div>';}).join('')+'</div>'+
    '<p style="margin:12px 0 0;font-size:12px;color:'+c.text2+'">Noviembre en curso (rayado).</p>');
  var funnel = card(h2('Estado de las reservas','18 reservas creadas en el periodo')+'<div style="margin-top:18px">'+funnelBar()+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px">'+[['33 %','llegaron'],['56 %','canceladas'],['11 %','vencidas']].map(function(k){return '<div style="background:'+c.card2+';border-radius:14px;padding:12px"><div class="tab" style="font-size:22px;font-weight:800;color:'+c.text+'">'+k[0]+'</div><div style="font-size:12px;color:'+c.text2+'">'+k[1]+'</div></div>';}).join('')+'</div>');

  /* calendario interactivo */
  var lab=['L','M','X','J','V','S','D']; var start=6; var cells=''; for(var i=0;i<start;i++) cells+='<span></span>';
  for(var d=1;d<=30;d++){ var inf=dayInfo(d); var v=inf.created; var lvl=v===null?-1:(v===0?0:Math.min(5,1+v)); var sel=d===S.day;
    var bg=lvl<0?'transparent':c.ramp[lvl]; var fg=lvl>=4?'#fff':c.text;
    cells+='<button '+(inf.future?'disabled ':'data-day="'+d+'" ')+'aria-pressed="'+sel+'" aria-label="'+d+' de noviembre" style="all:unset;'+(inf.future?'cursor:default;':'cursor:pointer;')+'position:relative;aspect-ratio:1/1;border-radius:12px;background:'+bg+';'+(lvl<0?'border:1.5px dashed '+c.border+';':'')+(sel?'box-shadow:0 0 0 2.5px '+c.text+';':'')+'padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box"><span class="tab" style="font-size:12px;font-weight:700;color:'+(lvl<0?c.text2:fg)+'">'+d+'</span>'+(v?'<span class="tab" style="font-size:11px;color:'+fg+'">'+v+' res.</span>':'')+(inf.ci?'<span style="position:absolute;top:7px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:'+c.ok+';color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center">'+inf.ci+'</span>':'')+'</button>'; }
  var cal = card('<div style="display:flex;justify-content:space-between;align-items:flex-start">'+h2('Noviembre','Selecciona un día para ver su detalle')+'<span style="font-size:12px;color:'+c.text2+'">Día 17 de 30</span></div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px">'+lab.map(function(l){return '<span style="font-size:11px;text-align:center;color:'+c.text2+'">'+l+'</span>';}).join('')+cells+'</div>'+
    '<div style="display:flex;gap:16px;align-items:center;margin-top:14px;font-size:12px;color:'+c.text2+';flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:4px">Reservas: menos '+c.ramp.map(function(r){return '<span style="width:12px;height:12px;border-radius:3px;background:'+r+'"></span>';}).join('')+' más</span><span><span style="display:inline-grid;place-items:center;width:16px;height:16px;border-radius:99px;background:'+c.ok+';color:#fff;font-size:9px;font-weight:800">2</span> Check-ins</span></div>');
  var di=dayInfo(S.day);
  var stat=function(n,l,col){return '<div style="background:'+c.card2+';border-radius:14px;padding:12px"><div class="tab" style="font-size:22px;font-weight:800;color:'+(col||c.text)+'">'+n+'</div><div style="font-size:12px;color:'+c.text2+'">'+l+'</div></div>';};
  var detail = card('<span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:'+c.text2+'">Detalle del día</span>'+
    '<h3 style="margin:6px 0 0;font-size:24px;font-weight:800;color:'+c.text+';">'+di.dow.charAt(0).toUpperCase()+di.dow.slice(1)+' '+S.day+' de noviembre</h3>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">'+stat(di.created,'reservas creadas')+stat(di.guests,'comensales')+stat(di.ci,'check-ins',c.ok)+stat(di.cancel+di.ns,'canceladas o vencidas')+'</div>'+
    '<div style="margin-top:18px;font-size:13px;font-weight:700;color:'+c.text+'">Check-ins del día</div>'+
    (di.rows.length?di.rows.map(function(r){return '<div class="tab" style="display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:10px 0;border-bottom:1px solid '+c.border+';font-size:14px;color:'+c.text+'"><span>'+r[0]+' · '+r[1]+'</span><span style="color:'+c.text2+'">'+r[2]+' personas</span><span>$'+fmt(D.fee)+'</span></div>';}).join(''):'<p style="margin:8px 0 0;font-size:13px;color:'+c.text2+'">Sin check-ins este día.</p>')+
    '<div style="display:flex;justify-content:space-between;margin-top:14px;font-size:14px;color:'+c.text+'"><span>Valor del día</span><strong class="tab">$'+fmt(di.ci*D.fee)+'</strong></div>');

  /* horas de mayor demanda */
  var peaks = D.peak.map(function(p,i){return '<div style="display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid '+c.border+'"><span style="font-weight:800;color:'+(i===0?c.accentText:c.text2)+'">'+(i+1)+'</span><span style="font-weight:700;color:'+c.text+'">'+p.h+'</span><span class="tab" style="font-size:13px;color:'+c.text2+'">'+p.n+' reservas</span></div>';}).join('');
  var demand = card(h2('Horas de mayor demanda','Reservas creadas por día de la semana y hora')+
    '<div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:36px;margin-top:18px;align-items:start">'+
      '<div>'+heat(false)+'</div>'+
      '<div><div style="font-size:13px;font-weight:700;color:'+c.text+'">Horas pico</div>'+peaks+'</div>'+
      '<div><div style="font-size:13px;font-weight:700;color:'+c.text+'">Por día de la semana</div><div style="margin-top:6px">'+weekBars(true)+'</div></div>'+
    '</div>');
  var bill = card('<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px">'+h2('Detalle del pago','Cada check-in del periodo · Hora de Bogotá')+'<span style="font-size:13px;color:'+c.accentText+';font-weight:700">Cómo se calcula</span></div>'+table(true));
  return title('Resumen','Reservas, comensales y pago del periodo.')+'<div style="margin-top:18px">'+periodBar()+'</div>'+
    '<div style="display:grid;gap:20px;margin-top:22px">'+hero+
    '<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start">'+cal+detail+'</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'+trend+funnel+'</div>'+demand+bill+'</div>';
}

function themeBtn(){ var c=t(); return '<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button data-theme="1" style="border:1px solid '+c.border+';background:'+c.card+';color:'+c.text+';padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700">'+(S.theme==='dark'?'Modo claro':'Modo oscuro')+'</button></div>'; }

function render(){ var c=t(); document.body.style.background=c.bg;
  var body = optF();
  document.getElementById('app').innerHTML='<div style="max-width:1200px;margin:0 auto;padding:24px">'+(S.noBar?'':themeBtn())+topbar()+
    '<main style="margin-top:20px;background:'+(S.theme==='dark'?'rgba(16,59,70,.35)':'rgba(255,255,255,.45)')+';border:1px solid '+c.border+';border-radius:28px;padding:36px">'+body+'</main>'+dock()+'</div>';
  document.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){S.day=+b.getAttribute('data-day');render();};});
  var tb=document.querySelector('[data-theme]'); if(tb) tb.onclick=function(){S.theme=S.theme==='dark'?'light':'dark';render();};
}
render();
</script>
</body>
</html>
